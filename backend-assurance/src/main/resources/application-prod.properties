# SQL Server

spring.datasource.url=jdbc:mysql://localhost:3306/assurance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Keycloak (port conteneur 8080, realm = assurance)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak-bsn:8080/realms/assurance
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-bsn:8080/realms/assurance/protocol/openid-connect/certs
